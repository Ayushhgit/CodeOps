# CodeOps AI - Docker Compose Configuration
# Use for local development and testing

version: '3.8'

services:
  # ==========================================================================
  # Core Services
  # ==========================================================================

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - SECRET_KEY=${SECRET_KEY:-development-secret-key-change-me}
      - DATABASE_URL=postgresql+asyncpg://codeops:codeops@postgres:5432/codeops
      - REDIS_URL=redis://redis:6379/0
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_PROVIDER=${AI_PROVIDER:-groq}
      - AI_MODEL=${AI_MODEL:-llama-3.3-70b-versatile}
    volumes:
      - ./backend/app:/app/app:ro
      - ./github-app-private-key.pem:/app/github-app-private-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: arq app.workers.WorkerSettings
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://codeops:codeops@postgres:5432/codeops
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./backend/app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # Data Stores
  # ==========================================================================

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=codeops
      - POSTGRES_PASSWORD=codeops
      - POSTGRES_DB=codeops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeops -d codeops"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # Development Tools
  # ==========================================================================

  # Webhook proxy for local development
  smee:
    image: node:20-alpine
    command: npx smee-client -u ${SMEE_URL} -t http://api:8000/webhooks/github
    environment:
      - SMEE_URL=${SMEE_URL}
    depends_on:
      - api
    profiles:
      - dev

  # Database admin UI
  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: codeops-network
